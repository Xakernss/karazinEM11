<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Группа — ХНУ имени Каразина</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=PT+Serif:wght@700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A2C6B;--blue:#1650B8;--soft:#EAF0FB;--line:#D3DCEE;--ink:#142038;--mute:#5A6781;--bg:#F5F7FB}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Golos Text",system-ui,sans-serif}
h1,h2{font-family:"PT Serif",Georgia,serif;margin:0}
header{background:var(--navy);color:#fff;border-bottom:4px solid var(--blue)}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header .wrap{padding-top:28px;padding-bottom:20px}
.uni{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
h1{font-size:clamp(1.7rem,5vw,2.4rem);margin:6px 0 2px}
header p{margin:0;opacity:.85}
nav{background:#fff;border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px}
nav a{padding:12px 14px;color:var(--navy);text-decoration:none;font-weight:500;border-bottom:3px solid transparent}
nav a:hover,nav a:focus-visible{border-color:var(--blue);outline:none}
section{padding:36px 0 8px}
h2{color:var(--navy);font-size:1.5rem;padding-bottom:8px;margin-bottom:16px;border-bottom:2px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--navy);padding:8px 16px;border-radius:6px}
button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 16px}
.row{display:grid;grid-template-columns:110px 1fr auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:baseline}
.row:first-child{border-top:0}
.row small{display:block;color:var(--mute)}
.room{color:var(--mute);font-size:.9rem}
.empty{padding:14px 0;color:var(--mute)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:14px 16px}
.card b{display:block}
.card span{color:var(--mute);display:block}
footer{padding:32px 16px;text-align:center;color:var(--mute);font-size:.9rem}
@media (max-width:520px){.row{grid-template-columns:1fr;gap:2px}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="uni">Харьковский национальный университет имени В. Н. Каразина</div>
<h1 id="gname">Группа ХХ-00</h1>
<p id="gsub">Факультет · курс</p>
</div></header>
<nav aria-label="Разделы"><div class="wrap"><a href="#schedule">Расписание</a><a href="#teachers">Преподаватели</a></div></nav>
<div class="wrap">
<section id="schedule">
<h2>Расписание</h2>
<div class="tabs" id="weekTabs" role="group" aria-label="Неделя"></div>
<div class="tabs" id="dayTabs" role="group" aria-label="День"></div>
<div class="box" id="dayList"></div>
</section>
<section id="teachers">
<h2>Преподаватели</h2>
<div class="grid" id="tGrid"></div>
</section>
</div>
<footer>Сверяйтесь с официальным расписанием на <a href="https://karazin.ua">karazin.ua</a></footer>

<script>
/* ====== РЕДАКТИРУЙТЕ ТОЛЬКО ЭТОТ БЛОК ====== */
const GROUP={name:"Группа ХХ-00",sub:"Факультет · 1 курс"};
// Первый понедельник семестра (эта неделя считается числителем)
const SEM_START="2026-08-31";
// w: 0 — каждую неделю, 1 — только числитель, 2 — только знаменатель
const SCHEDULE={
 1:[{t:"08:30–10:05",n:"Предмет 1 (лекция)",r:"ауд. 1-01",p:"Иванов И. И.",w:0},{t:"10:25–12:00",n:"Предмет 2 (практика)",r:"ауд. 2-14",p:"Петрова А. С.",w:0}],
 2:[{t:"10:25–12:00",n:"Предмет 3 (лекция)",r:"ауд. 3-05",p:"Сидоренко В. П.",w:1},{t:"12:20–13:55",n:"Предмет 4 (лаб.)",r:"ауд. 4-22",p:"Коваль Н. О.",w:2}],
 3:[{t:"08:30–10:05",n:"Предмет 2 (лекция)",r:"ауд. 1-01",p:"Петрова А. С.",w:0}],
 4:[{t:"10:25–12:00",n:"Предмет 1 (практика)",r:"ауд. 2-14",p:"Иванов И. И.",w:0}],
 5:[{t:"08:30–10:05",n:"Предмет 3 (практика)",r:"ауд. 3-05",p:"Сидоренко В. П.",w:0}]
};
const TEACHERS=[
 {n:"Иванов Иван Иванович",s:"Предмет 1",c:"ivanov@example.com"},
 {n:"Петрова Анна Сергеевна",s:"Предмет 2",c:"Кафедра, ауд. 2-10"},
 {n:"Сидоренко Виктор Петрович",s:"Предмет 3",c:"@telegram_username"}
];
/* ====== КОНЕЦ БЛОКА ====== */

const DAYS=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const parityOf=d=>Math.floor((d-new Date(SEM_START+"T00:00:00"))/(7*864e5))%2===0?1:2; // 1 числитель, 2 знаменатель
const curParity=parityOf(today);
const wd=now.getDay(), weekend=wd===0||wd===6;
// В выходные показываем понедельник следующей недели
let selDay=weekend?1:wd, selWeek=weekend?(curParity===1?2:1):curParity;
const wName=p=>p===1?"Числитель":"Знаменатель";
const lessons=(d,p)=>(SCHEDULE[d]||[]).filter(x=>x.w===0||x.w===p);

document.title=GROUP.name+" — ХНУ имени Каразина";
$("gname").textContent=GROUP.name;$("gsub").textContent=GROUP.sub;

function draw(){
 $("weekTabs").innerHTML=[1,2].map(p=>`<button aria-pressed="${p===selWeek}" data-w="${p}">${wName(p)}${p===curParity?" · сейчас":""}</button>`).join("");
 $("dayTabs").innerHTML=[1,2,3,4,5].map(d=>`<button aria-pressed="${d===selDay}" data-d="${d}">${DAYS[d].slice(0,2)}${d===wd?" · сегодня":""}</button>`).join("");
 const l=lessons(selDay,selWeek);
 $("dayList").innerHTML=l.length?l.map(x=>`<div class="row"><b>${esc(x.t)}</b><div>${esc(x.n)}<small>${esc(x.p)}</small></div><span class="room">${esc(x.r)}</span></div>`).join(""):`<div class="empty">В этот день пар нет.</div>`;
}
$("weekTabs").onclick=e=>{const b=e.target.closest("button");if(b){selWeek=+b.dataset.w;draw()}};
$("dayTabs").onclick=e=>{const b=e.target.closest("button");if(b){selDay=+b.dataset.d;draw()}};
draw();
$("tGrid").innerHTML=TEACHERS.map(t=>`<div class="card"><b>${esc(t.n)}</b><span>${esc(t.s)}</span><span>${esc(t.c)}</span></div>`).join("");
</script>
</body>
</html>
